; Programas gestionados por supervisor dentro del contenedor de la sonda.
;
;  - salt-minion: siempre activo (conecta con el coordinador).
;  - tranalyzer : NO arranca solo; lo inicia/detiene el coordinador vía Salt
;                 (tranalyzer.start/stop -> tranalyzerctl -> supervisorctl).

[program:salt-minion]
command=/usr/bin/salt-minion
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tranalyzer]
command=/usr/local/bin/run-tranalyzer.sh
autostart=false
autorestart=true
startsecs=8
startretries=5
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
