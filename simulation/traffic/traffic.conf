; Programa extra de supervisor SOLO para la simulación: genera tráfico sintético
; en la sonda para que Tranalyzer tenga flujos que capturar. Se monta en
; /etc/supervisor/conf.d/ desde el docker-compose de la simulación; la imagen de
; la sonda no se modifica.
[program:sim-traffic]
command=/bin/bash /usr/local/bin/sim-traffic.sh
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
